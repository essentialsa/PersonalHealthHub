      applyRecordsUpdate（记录/日志）、分类编辑、附件增删后 5 秒防抖触发
      runAutoBackupNow；默认开启（loadData 仅在保存过 false
      时关闭），云同步面板开关文案改为「自动备份」；空数据不空传，上传任务列表显示 waitingAuth 轻量提示。A3
      拉取保护：handleCloudPull 在云端较新时 window.confirm 弹窗显示两侧更新时间，用户确认后才合并；合并后 15
      秒抑制自动上传并清掉未触发的防抖定时器，避免拉取→上传循环。A4 附件同步：附件内容在新增后/备份上传前
      ensureAttachmentsUploaded 逐个上传到 Drive 个人/附件 文件夹，快照仅含元数据（toAttachmentMeta
      剥离 base64）；mergeCloudState 通过 mergeAttachmentMeta 合并元数据（云端 driveFileId
      优先）；本地 data 缓存按 4MB 预算用 planAttachmentCacheEviction 清理已同步附件（最早优先）；移除 20MB
      总量限制（Drive 为持久层），单文件 10MB 保留；预览对话框在本地无缓存时显示加载态并按需从 Drive
      下载（fetchGoogleDriveAttachmentData），恢复备份后附件元数据完整、预览可用。约束遵守：无数据库写入、凭据仅在浏览器本地、全部新增文案中文。
