acceptance:
  - id: A1
    source: brief.md
    text: A1 授权持久化：首次 Google 授权后，refresh token 持久保存；此后重新打开应用，无需人工重新授权即可完成 Drive 上传/拉取
    result: passed
    reason:
      text: 代码级验证，端到端待真机。refreshToken 随 authConfig 经 buildUserStorageKey+encryptData
        按用户持久化，重开应用后 ensureFreshGoogleDriveAuth 静默换取 access
        token，上传/拉取前自动调用，无人工授权步骤。
      truncated: false
  - id: A2
    source: brief.md
    text: A2 自动备份：记录数据发生变更后（增删改、导入），自动静默上传 Google Drive；提供开关，默认开启；家人无需任何手动操作
    result: passed
    reason:
      text: applyRecordsUpdate 内统一 triggerAutoBackup(records-updated)，覆盖增删改/撤销/Excel
        导入各路径；cloudAutoSync 默认 true，仅当存储值为 false 才关闭。
      truncated: false
  - id: A3
    source: brief.md
    text: A3 拉取保护：云端备份比本地新时，拉取前明确提示（显示两侧时间），不会静默覆盖本地
    result: passed
    reason:
      text: handleCloudPull 中云端较新时 window.confirm 显示两侧时间（zh-CN
        格式化），取消即中止，不覆盖；云端不比本地新时提示跳过。
      truncated: false
  - id: A4
    source: brief.md
    text: A4 附件同步：附件（报告照片/PDF）随备份上传 Google Drive；从备份恢复后附件可用；附件总量不再受 localStorage
      20MB 限制
    result: passed
    reason:
      text: 新增附件即经 ensureAttachmentsUploaded 传内容至 Drive 个人/附件 目录并记
        driveFileId，快照仅含元数据；恢复时 mergeAttachmentMeta 合并元数据，预览时按需云端取回；20MB
        总量校验已移除且有单测。
      truncated: false
  - id: A5
    source: specs/drive-backup/spec.md
    text: 首次连接 Google Drive 时走 OAuth 授权，请求参数包含 `access_type=offline` 与
      `prompt=consent`，授权后获得 refresh token
    result: passed
    reason:
      text: 代码级验证。OAuth URL 参数含 access_type offline 与 prompt consent（App.tsx
        ~2257/2262），token exchange 保存 refresh_token 到 authConfig。
      truncated: false
  - id: A6
    source: specs/drive-backup/spec.md
    text: refresh token 与用户隔离存储（沿用 `buildUserStorageKey` 体系）
    result: passed
    reason:
      text: refreshToken 存于 authConfig.googleDrive，经
        buildUserStorageKey(AUTH_CONFIG_STORAGE_KEY, userId)+XOR 加密写入
        localStorage，读写均走用户隔离 key。
      truncated: false
  - id: A7
    source: specs/drive-backup/spec.md
    text: 已持有 refresh token 的用户再次打开应用时，自动用 refresh token 静默换取 access token，不弹出授权页；仅在
      token 失效或被撤销时才提示重新授权
    result: passed
    reason:
      text: 代码级验证，端到端待真机。持有有效 refreshToken 时 ensureFreshGoogleDriveAuth
        静默续期，无强制跳转授权页逻辑；仅 invalid_grant 时降级并提示重新授权；googleDriveToken.test.ts 覆盖。
      truncated: false
  - id: A8
    source: specs/drive-backup/spec.md
    text: access token 过期时自动刷新，用户无感
    result: passed
    reason:
      text: enqueueCloudUpload/手动同步/拉取前均检查 isTokenExpiring
        并先静默续期，用户无感；googleDriveToken.test.ts 覆盖 grant_type、invalid_grant、网络错误。
      truncated: false
  - id: A9
    source: specs/drive-backup/spec.md
    text: 记录数据（健康记录、指标分类、变更日志）发生任何变更（增、删、改、Excel 导入、报告导入）后，防抖触发静默上传 Google Drive
    result: passed
    reason:
      text: 触发点齐备：applyRecordsUpdate（含导入）、categories-updated、indicator-logs-updated、attachment-added/deleted，统一
        5s 防抖且拉取后 15s 抑制防回传循环。
      truncated: false
  - id: A10
    source: specs/drive-backup/spec.md
    text: 默认开启；设置中提供开关（沿用/扩展现有"导入后自动上传"开关），关闭后回退手动上传
    result: passed
    reason:
      text: 默认开启；云同步面板自动备份开关（中文文案）可关，关闭后 triggerAutoBackup
        直接返回；手动同步入口独立存在且同样完成续期+附件上传。
      truncated: false
  - id: A11
    source: specs/drive-backup/spec.md
    text: 上传成功/失败在 UI 有轻量状态提示（不阻断操作）；失败不重试阻塞用户，下次变更再次尝试
    result: passed
    reason:
      text: cloudUploadTasks 记录 success/failed/waitingAuth 状态与中文
        errorMessage（如自动备份（等待授权）），仅状态提示不阻断操作。
      truncated: false
  - id: A12
    source: specs/drive-backup/spec.md
    text: 从云端拉取前对比云端备份与本地数据的更新时间
    result: passed
    reason:
      text: buildStateUpdatedAt 汇总
        records/categories/changeLogs/indicatorChangeLogs/attachments 时间戳，拉取前与云端
        updatedAt 比较。
      truncated: false
  - id: A13
    source: specs/drive-backup/spec.md
    text: 云端更新时弹窗提示并显示两侧时间，由用户确认后才覆盖本地；本地更新或相同时按现有逻辑处理
    result: passed
    reason:
      text: confirm 弹窗以 zh-CN 显示云端更新时间/本地更新时间，确认后才执行，取消返回。
      truncated: false
  - id: A14
    source: specs/drive-backup/spec.md
    text: 不做自动合并
    result: passed
    reason:
      text: 无未经用户确认的自动合并：合并仅在确认弹窗后执行，弹窗文案明示合并语义；系统不做后台自动冲突合并。
      truncated: false
  - id: A15
    source: specs/drive-backup/spec.md
    text: 附件（报告照片/PDF）上传至 Google Drive 作为持久层；本地保留缓存用于离线查看与预览
    result: passed
    reason:
      text: 代码级验证：Drive 为持久层，本地 4MB 缓存预算仅清理已同步附件（最早优先），被清空 data 的附件预览时由
        fetchGoogleDriveAttachmentData 按需取回；端到端待真机。
      truncated: false
  - id: A16
    source: specs/drive-backup/spec.md
    text: 附件总量不再受 localStorage 20MB 限制；单文件上限维持 10MB 起步（可配置常量）
    result: passed
    reason:
      text: 单测验证 19.5MB 总量可通过 addAttachment；MAX_FILE_SIZE=10MB 常量保留且有单测。
      truncated: false
  - id: A17
    source: specs/drive-backup/spec.md
    text: 从云端备份恢复后，附件完整可用（含预览）
    result: passed
    reason:
      text: 代码级验证：恢复合并元数据后 AttachmentPreviewDialog 对无 data 附件展示加载态并云端取回后渲染/下载；端到端待真机。
      truncated: false
  - id: A18
    source: specs/drive-backup/spec.md
    text: 附件上传失败时记录状态并允许重试，不阻塞记录本身的上传
    result: passed
    reason:
      text: ensureAttachmentsUploaded 对每个附件独立 try/catch，单个失败不阻塞其余附件与快照上传；失败附件无
        driveFileId，下次触发自动重试。
      truncated: false
  - id: A19
    source: specs/drive-backup/spec.md
    text: 健康数据与附件绝不写入任何数据库
    result: passed
    reason:
      text: 健康数据与附件仅写 localStorage（XOR 加密）与 Drive 文件，Supabase 仅用于 auth；代码中无数据库写入路径。
      truncated: false
  - id: A20
    source: specs/drive-backup/spec.md
    text: 凭据不进代码仓库；API 凭据仅在用户浏览器本地
    result: passed
    reason:
      text: clientId/clientSecret 均来自 import.meta.env VITE_*；git ls-files 无 .env
        或凭据入库。
      truncated: false
  - id: A21
    source: specs/drive-backup/spec.md
    text: 用户可见文案全部中文
    result: passed
    reason:
      text: 新增用户可见文案全为中文；英文仅出现在 console 日志，非用户可见。
      truncated: false
