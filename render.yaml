services:
  - type: web
    name: essentialsa-health-data-ocr
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./report-parser/Dockerfile
    dockerContext: ./report-parser
    healthCheckPath: /api/healthz
    buildFilter:
      paths:
        - report-parser/**
        - render.yaml
    envVars:
      - key: USE_MOCK
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: CORS_ALLOW_CREDENTIALS
        value: "false"
      # 多模态模型配置（值需在 Render 控制台设置）
      - key: VISION_LLM_BASE_URL
        value: "PLEASE_SET_IN_RENDER"
      - key: VISION_LLM_API_KEY
        sync: false
      - key: VISION_LLM_MODEL
        value: glm-4v-flash
      - key: VISION_LLM_FALLBACK_MODEL
        value: ""
      - key: VISION_LLM_TIMEOUT_SEC
        value: "60"
      - key: VISION_LLM_MAX_OUTPUT_TOKENS
        value: "2000"
